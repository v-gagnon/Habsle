name: Mise a jour quotidienne des stats LNH

on:
  schedule:
    # 9h48 UTC = 04h48 HNE (hiver) / 05h48 HAE (été) à Montréal
    - cron: "48 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-nhl-data:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer les fichiers du depot
        uses: actions/checkout@v4

      - name: Mettre a jour nhl-data.json (LNH + Carriere + Daily Faceoff)
        run: python3 scripts/update_nhl_data.py

      - name: Enregistrer nhl-data.json dans le depot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nhl-data.json
          git diff --staged --quiet || git commit -m "Mise a jour automatique des statistiques LNH et Daily Faceoff"
          git push