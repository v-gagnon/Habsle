name: Mise a jour quotidienne des stats LNH

on:
  schedule:
    # Créneau 1 : 03h17 UTC (22h17 HNE / 23h17 HAE) -> compense un délai GitHub de 4h à 9h pour arriver avant ~7h00
    - cron: "17 3 * * *"
    # Créneau 2 : 07h23 UTC (02h23 HNE / 03h23 HAE) -> garantit les matchs de l'Ouest si le délai est faible
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nhl-data
  cancel-in-progress: false

jobs:
  fetch-nhl-data:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer les fichiers du depot
        uses: actions/checkout@v5

      - name: Mettre a jour nhl-data.json (LNH + Carriere + Daily Faceoff)
        run: |
          pip install --quiet curl_cffi
          python3 scripts/update_nhl_data.py

      - name: Enregistrer nhl-data.json dans le depot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nhl-data.json
          git diff --staged --quiet || git commit -m "Mise a jour automatique des statistiques LNH et Daily Faceoff"
          git push